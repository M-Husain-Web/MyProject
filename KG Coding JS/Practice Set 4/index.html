<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Set4 Excercise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<button id="div1" onclick="cartQuantity++;
document.querySelector('#cart_summary').innerText = `Your bag has ${cartQuantity} items`;">
Add to Bag</button>

<button id="div2" onclick="cartQuantity--;
document.querySelector('#cart_summary').innerText = `Your bag has ${cartQuantity} items`;">
Move to Wishlist</button>

<button id="div3" onclick="cartQuantity +=2;
document.querySelector('#cart_summary').innerText = `Your bag has ${cartQuantity} items`;">
Add 1+1 Sale item</button>

<h1 id="cart_summary"></h1>

<script>
    let cartQuantity = 0;
    document.querySelector('#cart_summary').innerText = `Your bag has ${cartQuantity} items`;
</script>
</body>
</html>
