<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project_Guess Number
    </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<p>Enter a guess between 0 to 100</p>
<form>
<input class="UserInput" type=number placeholder="Enter a number" required max="100"  >
<br><br>
<div class="button">
    <button class="submit_btn" >Submit</button>
    <button type="button"  class="RestartGame_btn" disabled >Restart Game</button>
</div>
<p class="result"></p>
<p class="all_guesses"></p>

</form>




<script src="script.js"></script>
</body>
</html>
