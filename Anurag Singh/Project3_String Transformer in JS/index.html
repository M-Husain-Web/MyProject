<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Transformer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <input class="text_input" type="text" placeholder="Enter the sentence with spaces(alphanumeric)">
   
<div class="transformed-output" id="lower-case">
    <label>Lower case</label>
    <span></span>
</div>
<div class="transformed-output" id="Upper-case">
    <label>Upper case</label>
    <span></span>
</div>
<div class="transformed-output" id="camel-case">
    <label>Camel case</label>
    <span></span>
</div>
<div class="transformed-output" id="Pascal-case">
    <label>Pascal case</label>
    <span></span>
</div>
<div class="transformed-output" id="snake-case">
    <label>Snake case</label>
    <span></span>
</div>
<div class="transformed-output" id="kabab-case">
    <label>kabab case</label>
    <span></span>
</div>
<div class="transformed-output" id="trim">
    <label>Trim</label>
    <span></span>
</div>
</main>

    <script src="script.js"></script>
</body>
</html>
